<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/learn-claude-code/" />
    <title>Claude Code 文档阅读器</title>
    <style>
      :root {
        --bg: #0b1020;
        --panel: rgba(17, 24, 39, 0.92);
        --border: #2a3445;
        --text: #e5e7eb;
        --muted: #9ca3af;
        --primary: #2563eb;
        --primary-soft: rgba(37, 99, 235, 0.16);
        --code: rgba(255, 255, 255, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(circle at top, #172554 0%, #0b1020 55%);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      }

      a {
        color: #93c5fd;
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }

      .page {
        width: min(980px, calc(100vw - 32px));
        margin: 0 auto;
        padding: 32px 0 64px;
      }

      .shell {
        border: 1px solid var(--border);
        border-radius: 24px;
        background: var(--panel);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.28);
        overflow: hidden;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 16px;
        padding: 24px 28px 20px;
        border-bottom: 1px solid var(--border);
        background: linear-gradient(180deg, rgba(15, 23, 42, 0.96), rgba(17, 24, 39, 0.92));
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 12px;
        border-radius: 999px;
        background: var(--primary-soft);
        border: 1px solid rgba(96, 165, 250, 0.28);
        color: #bfdbfe;
        font-size: 13px;
      }

      h1 {
        margin: 16px 0 10px;
        font-size: clamp(28px, 4vw, 40px);
        line-height: 1.15;
      }

      .summary {
        margin: 0;
        max-width: 680px;
        color: var(--muted);
        line-height: 1.75;
        font-size: 15px;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 42px;
        padding: 10px 14px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: rgba(15, 23, 42, 0.72);
        color: var(--text);
        font-size: 14px;
        font-weight: 600;
        white-space: nowrap;
      }

      .button.primary {
        border-color: transparent;
        background: var(--primary);
        color: white;
      }

      .button:hover {
        text-decoration: none;
        border-color: #41516b;
      }

      .content {
        padding: 28px;
      }

      .status {
        padding: 18px;
        border: 1px solid rgba(96, 165, 250, 0.2);
        border-radius: 16px;
        background: rgba(30, 41, 59, 0.45);
        color: var(--muted);
        line-height: 1.7;
      }

      .status strong {
        color: var(--text);
      }

      .status.error {
        border-color: rgba(248, 113, 113, 0.3);
        background: rgba(127, 29, 29, 0.18);
      }

      .markdown {
        line-height: 1.8;
        font-size: 16px;
      }

      .markdown > :first-child {
        margin-top: 0;
      }

      .markdown h1,
      .markdown h2,
      .markdown h3,
      .markdown h4,
      .markdown h5,
      .markdown h6 {
        margin: 1.8em 0 0.7em;
        line-height: 1.35;
      }

      .markdown h1 {
        font-size: 2rem;
      }

      .markdown h2 {
        font-size: 1.55rem;
        padding-bottom: 0.35rem;
        border-bottom: 1px solid rgba(148, 163, 184, 0.18);
      }

      .markdown h3 {
        font-size: 1.2rem;
      }

      .markdown p,
      .markdown ul,
      .markdown ol,
      .markdown blockquote,
      .markdown pre,
      .markdown table {
        margin: 0 0 1rem;
      }

      .markdown ul,
      .markdown ol {
        padding-left: 1.5rem;
      }

      .markdown li + li {
        margin-top: 0.35rem;
      }

      .markdown hr {
        margin: 2rem 0;
        border: 0;
        border-top: 1px solid rgba(148, 163, 184, 0.18);
      }

      .markdown blockquote {
        margin-left: 0;
        padding: 0.3rem 1rem;
        border-left: 4px solid rgba(96, 165, 250, 0.45);
        background: rgba(30, 41, 59, 0.4);
        color: #cbd5e1;
      }

      .markdown code {
        padding: 0.14rem 0.4rem;
        border-radius: 6px;
        background: var(--code);
        font-size: 0.92em;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }

      .markdown pre {
        overflow-x: auto;
        padding: 14px 16px;
        border-radius: 14px;
        background: #0f172a;
        border: 1px solid rgba(148, 163, 184, 0.16);
      }

      .markdown pre code {
        display: block;
        padding: 0;
        background: transparent;
        font-size: 0.9rem;
      }

      .markdown img {
        display: block;
        max-width: 100%;
        height: auto;
        margin: 1rem auto;
        border-radius: 14px;
        border: 1px solid rgba(148, 163, 184, 0.14);
      }

      .markdown table {
        width: 100%;
        border-collapse: collapse;
        overflow: hidden;
        border-radius: 12px;
        border: 1px solid rgba(148, 163, 184, 0.16);
      }

      .markdown th,
      .markdown td {
        padding: 10px 12px;
        border-bottom: 1px solid rgba(148, 163, 184, 0.12);
        text-align: left;
      }

      .markdown thead {
        background: rgba(30, 41, 59, 0.55);
      }

      .markdown tbody tr:nth-child(even) {
        background: rgba(15, 23, 42, 0.3);
      }

      .markdown .anchor {
        color: inherit;
      }

      @media (max-width: 720px) {
        .page {
          width: min(100vw - 20px, 980px);
          padding: 20px 0 40px;
        }

        .topbar,
        .content {
          padding: 20px 18px;
        }

        .topbar {
          flex-direction: column;
        }

        .actions {
          width: 100%;
        }

        .actions .button {
          flex: 1 1 auto;
        }
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  </head>
  <body>
    <main class="page">
      <section class="shell">
        <header class="topbar">
          <div>
            <div class="eyebrow">Claude Code 站内文档阅读器</div>
            <h1 id="page-title">正在加载文档…</h1>
            <p class="summary" id="page-summary">将仓库中的 Markdown 文档直接渲染为网页，便于在 GitHub Pages 中连续阅读。</p>
          </div>
          <div class="actions">
            <a class="button primary" href="index.html">返回首页</a>
            <a class="button" id="source-link" href="https://github.com/IVANLEE99/learn-claude-code" target="_blank" rel="noreferrer">查看 GitHub 源文件</a>
          </div>
        </header>
        <section class="content">
          <div class="status" id="status">正在获取 Markdown 文档内容…</div>
          <article class="markdown" id="article" hidden></article>
        </section>
      </section>
    </main>

    <script>
      const REPO_BASE = "https://github.com/IVANLEE99/learn-claude-code";
      const DOCS = {
        install: {
          title: "Claude Code 安装文档",
          description: "环境准备、安装、登录与基础配置说明。",
          path: "Claude Code安装文档/Claude Code安装文档.md",
        },
        beginner: {
          title: "Claude Code 新手入门",
          description: "快速理解 Claude Code 的使用场景、提问方式与新手工作习惯。",
          path: "Claude Code新手入门.md",
        },
        concepts: {
          title: "Claude 相关概念详解",
          description: "系统理解 Claude、Claude Code、Agent、Skill、MCP、Hook 等关键概念。",
          path: "Claude相关概念详解.md",
        },
        prompts: {
          title: "中文提示词模板",
          description: "覆盖看项目、解释代码、修 Bug、改功能等常见场景的中文模板。",
          path: "prompt_template.md",
        },
        guide: {
          title: "AI 工具飞速上手之 Claude Code",
          description: "更完整的长文教程，适合系统化阅读 Claude Code 工作流。",
          path: "AI工具飞速上手之Claude Code/AI工具飞速上手之Claude Code.md",
        },
        readme: {
          title: "README",
          description: "仓库首页说明文档。",
          path: "README.md",
        },
      };

      const titleEl = document.getElementById("page-title");
      const summaryEl = document.getElementById("page-summary");
      const statusEl = document.getElementById("status");
      const articleEl = document.getElementById("article");
      const sourceLinkEl = document.getElementById("source-link");
      const slug = new URLSearchParams(window.location.search).get("doc");

      function encodeRepoPath(path) {
        return path
          .split("/")
          .map((segment) => encodeURIComponent(segment))
          .join("/");
      }

      function normalizeRepoPath(path) {
        return decodeURIComponent(path.replace(/^\/+/, "").replace(/\/+/g, "/"));
      }

      function toRepoRelativePath(input, baseHref = document.baseURI) {
        const resolved = new URL(input, baseHref);
        const siteBase = new URL(document.baseURI);
        const basePath = siteBase.pathname.endsWith("/") ? siteBase.pathname : `${siteBase.pathname}/`;
        let pathname = resolved.pathname;

        if (pathname.startsWith(basePath)) {
          pathname = pathname.slice(basePath.length);
        } else {
          pathname = pathname.replace(/^\/+/, "");
        }

        return normalizeRepoPath(pathname);
      }

      function isUntouchedLink(value) {
        return /^(?:[a-z]+:|#|\/)/i.test(value);
      }

      function buildDocMaps() {
        const pathToSlug = {};
        for (const [key, entry] of Object.entries(DOCS)) {
          pathToSlug[normalizeRepoPath(entry.path)] = key;
        }
        return pathToSlug;
      }

      const pathToSlug = buildDocMaps();

      function slugifyHeadingText(text) {
        return text
          .trim()
          .toLowerCase()
          .replace(/[\s./]+/g, "-")
          .replace(/[^\p{Letter}\p{Number}\-_]+/gu, "")
          .replace(/-+/g, "-")
          .replace(/^-|-$/g, "");
      }

      function sanitizeRenderedContent() {
        const blockedTags = articleEl.querySelectorAll("script, iframe, object, embed, form, input, button, textarea, select");
        for (const node of blockedTags) {
          node.remove();
        }

        const elements = articleEl.querySelectorAll("*");
        for (const element of elements) {
          for (const attr of Array.from(element.attributes)) {
            const name = attr.name.toLowerCase();
            const value = attr.value.trim();
            if (name.startsWith("on")) {
              element.removeAttribute(attr.name);
              continue;
            }

            if ((name === "href" || name === "src") && /^javascript:/i.test(value)) {
              element.removeAttribute(attr.name);
            }
          }
        }
      }

      function assignHeadingIds() {
        const usedIds = new Set();
        const headings = articleEl.querySelectorAll("h1, h2, h3, h4, h5, h6");

        for (const heading of headings) {
          let candidate = heading.id || slugifyHeadingText(heading.textContent || "");
          if (!candidate) continue;

          let uniqueId = candidate;
          let suffix = 2;
          while (usedIds.has(uniqueId) || document.getElementById(uniqueId)) {
            if (heading.id === uniqueId) break;
            uniqueId = `${candidate}-${suffix}`;
            suffix += 1;
          }

          heading.id = uniqueId;
          usedIds.add(uniqueId);
        }
      }

      function setStatus(message, isError = false) {
        statusEl.hidden = false;
        statusEl.textContent = message;
        statusEl.classList.toggle("error", isError);
        articleEl.hidden = true;
        articleEl.innerHTML = "";
      }

      function revealArticle() {
        statusEl.hidden = true;
        articleEl.hidden = false;
      }

      function updatePageMeta(entry) {
        titleEl.textContent = entry.title;
        summaryEl.textContent = entry.description;
        sourceLinkEl.href = `${REPO_BASE}/blob/main/${encodeRepoPath(entry.path)}`;
        document.title = `${entry.title} · Claude Code 文档阅读器`;
      }

      function rewriteRelativeUrl(url, docUrl) {
        return new URL(url, docUrl).href;
      }

      function rewriteRenderedContent(entry) {
        const docUrl = new URL(entry.path, document.baseURI).href;
        const links = articleEl.querySelectorAll("a[href]");
        const inlineHtmlImages = articleEl.querySelectorAll("img:not([src])");

        for (const img of inlineHtmlImages) {
          const dataSrc = img.getAttribute("data-src");
          if (dataSrc && !img.getAttribute("src")) {
            img.setAttribute("src", dataSrc);
          }
        }

        const images = articleEl.querySelectorAll("img[src]");

        for (const img of images) {
          const style = img.getAttribute("style");
          if (style) {
            img.removeAttribute("style");
          }

          const src = img.getAttribute("src");
          if (!src || isUntouchedLink(src)) continue;
          img.src = rewriteRelativeUrl(src, docUrl);
          img.loading = "lazy";
        }

        for (const link of links) {
          const href = link.getAttribute("href");
          if (!href) continue;

          if (/^https?:/i.test(href)) {
            link.target = "_blank";
            link.rel = "noreferrer";
            continue;
          }

          if (isUntouchedLink(href)) {
            continue;
          }

          const cleanHref = href.split("#")[0];
          const fragment = href.includes("#") ? href.slice(href.indexOf("#")) : "";
          const absolute = rewriteRelativeUrl(href, docUrl);
          const repoPath = toRepoRelativePath(cleanHref, docUrl);

          if (cleanHref.toLowerCase().endsWith(".md")) {
            const targetSlug = pathToSlug[repoPath];
            link.href = targetSlug ? `viewer.html?doc=${targetSlug}${fragment}` : absolute;
          } else {
            link.href = absolute;
          }
        }
      }

      function syncHashAnchor() {
        if (!window.location.hash) return;
        const id = decodeURIComponent(window.location.hash.slice(1));
        const target = document.getElementById(id);
        if (target) {
          target.scrollIntoView();
        }
      }

      async function renderDocument() {
        if (!slug || !DOCS[slug]) {
          titleEl.textContent = "未找到文档";
          summaryEl.textContent = "请从首页重新选择需要阅读的文档。";
          sourceLinkEl.href = REPO_BASE;
          setStatus("当前链接缺少有效的 doc 参数，无法确定要加载哪一篇 Markdown 文档。", true);
          return;
        }

        if (!window.marked || typeof window.marked.parse !== "function") {
          updatePageMeta(DOCS[slug]);
          setStatus("Markdown 渲染库加载失败，请检查网络后刷新页面。", true);
          return;
        }

        const entry = DOCS[slug];
        updatePageMeta(entry);

        try {
          const response = await fetch(entry.path);
          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }

          const markdown = await response.text();
          articleEl.innerHTML = window.marked.parse(markdown, {
            gfm: true,
            breaks: false,
          });
          sanitizeRenderedContent();
          assignHeadingIds();
          rewriteRenderedContent(entry);
          revealArticle();
          syncHashAnchor();
        } catch (error) {
          setStatus(`文档加载失败：${error.message}。请确认 GitHub Pages 已发布最新文件，或稍后重试。`, true);
        }
      }

      renderDocument();
    </script>
  </body>
</html>
