<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>贪吃蛇小游戏</title>
    <style>
      :root {
        --bg: #111827;
        --panel: #1f2937;
        --grid: #243042;
        --snake: #22c55e;
        --food: #ef4444;
        --text: #e5e7eb;
        --muted: #9ca3af;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, #1f2937, #0b1020 60%);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
        color: var(--text);
      }
      .card {
        width: min(92vw, 560px);
        background: rgba(17, 24, 39, 0.88);
        border: 1px solid #374151;
        border-radius: 16px;
        padding: 14px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      }
      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 10px;
      }
      .title {
        font-size: 18px;
        font-weight: 700;
      }
      .score {
        font-size: 14px;
        color: var(--muted);
      }
      canvas {
        width: 100%;
        height: auto;
        display: block;
        border-radius: 12px;
        border: 1px solid #374151;
        background: linear-gradient(#0f172a, #0b1222);
      }
      .hint {
        margin-top: 10px;
        font-size: 13px;
        color: var(--muted);
        line-height: 1.5;
      }
      .hint b { color: #d1d5db; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="topbar">
        <div class="title">贪吃蛇</div>
        <div class="score">分数：<span id="score">0</span> ｜ 最高分：<span id="best">0</span></div>
      </div>
      <canvas id="game" width="480" height="480" aria-label="贪吃蛇游戏画布"></canvas>
      <div class="hint">
        <b>操作：</b>方向键 / WASD 控制，<b>空格</b>暂停继续，<b>R</b>重新开始。撞墙或撞到自己会结束。
      </div>
    </div>

    <script>
      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");
      const scoreEl = document.getElementById("score");
      const bestEl = document.getElementById("best");

      const GRID = 20;
      const CELL = canvas.width / GRID;
      const BASE_STEP_MS = 130;
      const MIN_STEP_MS = 70;

      let snake = [];
      let dir = { x: 1, y: 0 };
      let nextDir = { x: 1, y: 0 };
      let food = { x: 10, y: 10 };
      let score = 0;
      let best = Number(localStorage.getItem("snake_best") || 0);
      let gameOver = false;
      let paused = false;
      let lastTime = 0;
      let acc = 0;

      bestEl.textContent = String(best);

      function reset() {
        snake = [
          { x: 8, y: 10 },
          { x: 7, y: 10 },
          { x: 6, y: 10 },
        ];
        dir = { x: 1, y: 0 };
        nextDir = { x: 1, y: 0 };
        score = 0;
        gameOver = false;
        paused = false;
        scoreEl.textContent = "0";
        placeFood();
      }

      function placeFood() {
        while (true) {
          const p = {
            x: Math.floor(Math.random() * GRID),
            y: Math.floor(Math.random() * GRID),
          };
          if (!snake.some((s) => s.x === p.x && s.y === p.y)) {
            food = p;
            return;
          }
        }
      }

      function setDirection(x, y) {
        if (x === -dir.x && y === -dir.y) return;
        nextDir = { x, y };
      }

      function stepSpeed() {
        return Math.max(MIN_STEP_MS, BASE_STEP_MS - Math.floor(score / 4) * 5);
      }

      function tick() {
        dir = nextDir;
        const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

        if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID) {
          gameOver = true;
          return;
        }

        if (snake.some((s) => s.x === head.x && s.y === head.y)) {
          gameOver = true;
          return;
        }

        snake.unshift(head);

        if (head.x === food.x && head.y === food.y) {
          score += 1;
          scoreEl.textContent = String(score);
          if (score > best) {
            best = score;
            bestEl.textContent = String(best);
            localStorage.setItem("snake_best", String(best));
          }
          placeFood();
        } else {
          snake.pop();
        }
      }

      function drawGrid() {
        ctx.strokeStyle = "#1f2937";
        ctx.lineWidth = 1;
        for (let i = 1; i < GRID; i++) {
          const p = i * CELL;
          ctx.beginPath();
          ctx.moveTo(p, 0);
          ctx.lineTo(p, canvas.height);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(0, p);
          ctx.lineTo(canvas.width, p);
          ctx.stroke();
        }
      }

      function drawCell(x, y, color, radius = 5) {
        const px = x * CELL;
        const py = y * CELL;
        ctx.fillStyle = color;
        const r = Math.min(radius, CELL / 2 - 1);
        ctx.beginPath();
        ctx.roundRect(px + 1.5, py + 1.5, CELL - 3, CELL - 3, r);
        ctx.fill();
      }

      function drawOverlay(text, sub) {
        ctx.fillStyle = "rgba(0,0,0,0.45)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "#f9fafb";
        ctx.textAlign = "center";
        ctx.font = "bold 36px sans-serif";
        ctx.fillText(text, canvas.width / 2, canvas.height / 2 - 8);

        ctx.font = "16px sans-serif";
        ctx.fillStyle = "#d1d5db";
        ctx.fillText(sub, canvas.width / 2, canvas.height / 2 + 24);
      }

      function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawGrid();

        drawCell(food.x, food.y, "#ef4444", 8);

        for (let i = snake.length - 1; i >= 0; i--) {
          const s = snake[i];
          const color = i === 0 ? "#4ade80" : "#22c55e";
          drawCell(s.x, s.y, color, i === 0 ? 7 : 5);
        }

        if (paused && !gameOver) drawOverlay("已暂停", "按空格继续");
        if (gameOver) drawOverlay("游戏结束", "按 R 重新开始");
      }

      function loop(ts) {
        const dt = ts - lastTime;
        lastTime = ts;

        if (!paused && !gameOver) {
          acc += dt;
          const step = stepSpeed();
          while (acc >= step) {
            tick();
            acc -= step;
            if (gameOver) break;
          }
        }

        render();
        requestAnimationFrame(loop);
      }

      window.addEventListener("keydown", (e) => {
        const k = e.key.toLowerCase();

        if (["arrowup", "arrowdown", "arrowleft", "arrowright", " ", "w", "a", "s", "d", "r"].includes(k) || e.key === " ") {
          e.preventDefault();
        }

        if (k === "arrowup" || k === "w") setDirection(0, -1);
        if (k === "arrowdown" || k === "s") setDirection(0, 1);
        if (k === "arrowleft" || k === "a") setDirection(-1, 0);
        if (k === "arrowright" || k === "d") setDirection(1, 0);

        if (k === " ") {
          if (!gameOver) paused = !paused;
        }

        if (k === "r") {
          reset();
        }
      });

      reset();
      requestAnimationFrame((t) => {
        lastTime = t;
        loop(t);
      });
    </script>
  </body>
</html>
